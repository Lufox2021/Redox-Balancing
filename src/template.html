<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Balancing Redox Reactions</title>
<style>
:root{
  --ink:#1d2433; --muted:#5d6678; --line:#d9dee8; --bg:#f6f7fb; --card:#fff;
  --ox:#c2561a; --oxbg:#fff3ea; --red:#1f5fbf; --redbg:#eaf2ff;
  --ok:#1d7a46; --okbg:#e7f6ec; --bad:#b42318; --badbg:#fdecea; --hint:#7a5a00; --hintbg:#fff7db;
  --accent:#3b3f99;
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg);font-size:16px;line-height:1.45}
header{background:#fff;border-bottom:1px solid var(--line);padding:14px 24px 0}
header h1{margin:0;font-size:22px}
header .sub{color:var(--muted);font-size:14px;margin:2px 0 10px}
nav.tabs{display:flex;gap:4px}
nav.tabs button{border:1px solid transparent;border-bottom:none;background:none;padding:9px 16px;font-size:15px;cursor:pointer;border-radius:8px 8px 0 0;color:var(--muted)}
nav.tabs button.active{background:var(--bg);border-color:var(--line);color:var(--ink);font-weight:600;margin-bottom:-1px}
main{max-width:1150px;margin:0 auto;padding:20px 24px 60px}
.tab{display:none}.tab.active{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:14px}
.card h2{margin:0 0 8px;font-size:18px}
.card h3{margin:14px 0 6px;font-size:16px}
.step{position:relative}
.step .num{display:inline-flex;width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;align-items:center;justify-content:center;font-weight:700;margin-right:8px;font-size:14px}
.step.locked{opacity:.45}
.step.locked .body{display:none}
.step.done .num{background:var(--ok)}
.step h2{display:flex;align-items:center}
.instr{color:var(--muted);margin:2px 0 10px}
button.btn{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:7px;padding:7px 14px;font-size:14px;cursor:pointer}
button.btn.secondary{background:#fff;color:var(--accent)}
button.btn.small{padding:4px 10px;font-size:13px}
button.btn:disabled{opacity:.5;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.chips button{border:1px solid var(--line);background:#fff;border-radius:16px;padding:5px 12px;cursor:pointer;font-size:14px}
.chips button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.chips .count{opacity:.7;font-size:12px;margin-left:4px}
select,input[type=text],input[type=number]{font-size:15px;padding:6px 8px;border:1px solid #b9c0ce;border-radius:6px;font-family:inherit}
input.eqin{width:100%;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px;padding:8px 10px}
input.eqin:disabled{background:#f2f3f6;color:#444}
.preview{min-height:26px;margin:6px 0 2px;font-size:18px}
.preview .lbl{font-size:12px;color:var(--muted);margin-right:6px}
.eq{font-size:20px}
.eq .arrow{margin:0 .4em}
.eq .plus{margin:0 .25em}
.state{font-size:.7em;color:var(--muted)}
sub,sup{font-size:.68em}
.problem{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:#fbfbfe;border:1px dashed #c8cde0;border-radius:8px;padding:10px 14px;margin:8px 0}
.badge{display:inline-block;border-radius:12px;padding:2px 10px;font-size:13px;font-weight:600}
.badge.acidic{background:#fde8e8;color:#9b1c1c}
.badge.basic{background:#e3eefc;color:#1e4f9a}
.badge.lvl{background:#eee;color:#444}
.fb{margin-top:8px;border-radius:7px;padding:8px 12px;font-size:14.5px}
.fb:empty{display:none}
.fb.ok{background:var(--okbg);color:var(--ok)}
.fb.bad{background:var(--badbg);color:var(--bad)}
.fb.hint{background:var(--hintbg);color:var(--hint)}
.fb ul{margin:4px 0 0;padding-left:20px}
.fb .rule{margin-top:6px;color:var(--hint);background:var(--hintbg);border-radius:6px;padding:6px 10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px}
table.inv{border-collapse:collapse;font-size:13.5px;margin-top:4px}
table.inv th,table.inv td{border:1px solid var(--line);padding:2px 9px;text-align:center}
table.inv th{background:#f3f4f8;font-weight:600}
table.inv td.good{color:var(--ok);font-weight:700}
table.inv td.badc{color:var(--bad);font-weight:700}
table.inv tr.later td{color:#aab;font-weight:400}
.invtoggle{font-size:13px;color:var(--muted)}
table.on{border-collapse:collapse;margin:6px 0}
table.on td{padding:5px 8px;border-bottom:1px solid #eef0f4;vertical-align:middle}
table.on td.sp{font-size:19px;min-width:120px}
.oncell{display:inline-flex;align-items:center;gap:4px;margin-right:12px}
.oncell b{font-weight:600}
.oncell input{width:62px;text-align:center}
input.right{border-color:var(--ok);background:var(--okbg)}
input.wrong{border-color:var(--bad);background:var(--badbg)}
.idgrid{display:grid;grid-template-columns:200px 1fr;gap:8px 12px;align-items:center;margin-top:8px}
.idgrid label{margin-right:12px;white-space:nowrap}
.halves{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.halfcol{border-radius:9px;padding:10px 12px}
.halfcol.ox{background:var(--oxbg);border:1px solid #f1c7a9}
.halfcol.red{background:var(--redbg);border:1px solid #b9cff2}
.halfcol h3{margin:0 0 6px}
.halfcol.ox h3{color:var(--ox)}
.halfcol.red h3{color:var(--red)}
.substep{border-top:1px solid rgba(0,0,0,.08);padding:8px 0}
.substep.future{color:#9aa1ae}
.substep .t{font-weight:600;font-size:14.5px}
.substep .done-eq{font-size:17px!important;margin-top:2px}
.tick{color:var(--ok);font-weight:700;margin-left:4px}
.multline{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:18px;flex-wrap:wrap}
.multline input{width:64px}
.final{font-size:24px;padding:10px 0}
.donebox{background:var(--okbg);border:1px solid #a7dcb8;border-radius:10px;padding:14px 16px}
.split2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.muted{color:var(--muted)}
.small{font-size:13.5px}
ol.method li{margin:4px 0}
table.rules{border-collapse:collapse;width:100%;font-size:14.5px}
table.rules td,table.rules th{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
table.rules th{background:#f3f4f8}
table.worked{border-collapse:collapse;width:100%;font-size:15px}
table.worked td{border-top:1px solid var(--line);padding:7px 8px;vertical-align:top}
table.worked td:first-child{font-weight:600;width:210px;color:var(--muted)}
table.worked .eq{font-size:17px}
.oxt{color:var(--ox);font-weight:600}.redt{color:var(--red);font-weight:600}
table.val{border-collapse:collapse;width:100%;font-size:14px;margin-top:8px}
table.val td,table.val th{border:1px solid var(--line);padding:4px 8px;text-align:left}
table.val tr.err td{background:var(--badbg)}
code{background:#f0f1f5;padding:1px 5px;border-radius:4px;font-size:.92em}
.score{font-size:14px;color:var(--muted)}
.typing{font-size:14px}
.typing td{padding:3px 10px 3px 0}
.notice{background:#fffbe8;border:1px solid #f0dc9a;border-radius:8px;padding:8px 12px;font-size:14px;margin-bottom:12px}
</style>
</head>
<body>
<header>
  <h1>Balancing Redox Reactions</h1>
  <div class="sub">The half-reaction method, in acidic and basic solution</div>
  <nav class="tabs" id="tabs">
    <button data-tab="review">Review</button>
    <button data-tab="coach" class="active">Coaching</button>
    <button data-tab="test">Testing</button>
    <button data-tab="instructor">Instructor</button>
  </nav>
</header>
<main>
  <section class="tab" id="tab-review"></section>
  <section class="tab active" id="tab-coach">
    <div class="card" id="coach-pick"></div>
    <div id="coach-steps"></div>
  </section>
  <section class="tab" id="tab-test"></section>
  <section class="tab" id="tab-instructor"></section>
</main>
<script>
/*ENGINE*/
</script>
<script>
/*PROBLEMS*/
</script>
<script>
/*UI*/
</script>
</body>
</html>
